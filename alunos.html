<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ulysses Acervo - Alunos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- MENU -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">

            <span class="navbar-brand fw-bold">
                📚 Ulysses Acervo
            </span>

            <div>

                <button
                    class="btn btn-light btn-sm me-2"
                    onclick="voltar()"
                >
                    ← Voltar
                </button>

                <button
                    class="btn btn-danger btn-sm"
                    onclick="sair()"
                >
                    Sair
                </button>

            </div>

        </div>
    </nav>


    <!-- CONTEÚDO -->
    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold">
                    👥 Alunos
                </h2>

                <p class="text-muted">
                    Gerenciamento dos alunos cadastrados
                </p>

            </div>

            <button
                class="btn btn-primary"
                onclick="abrirCadastro()"
            >
                + Cadastrar Aluno
            </button>

        </div>


        <!-- PESQUISA -->
        <div class="card shadow-sm border-0 mb-4">

            <div class="card-body">

                <label class="form-label fw-bold">
                    Pesquisar aluno
                </label>

                <input
                    type="text"
                    id="pesquisa"
                    class="form-control"
                    placeholder="Digite o nome ou matrícula..."
                    onkeyup="listarAlunos()"
                >

            </div>

        </div>


        <!-- LISTA -->
        <div class="card shadow-sm border-0">

            <div class="card-body">

                <h5 class="fw-bold mb-3">
                    Alunos cadastrados
                </h5>

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-light">

                            <tr>
                                <th>Nome</th>
                                <th>Matrícula</th>
                                <th>Turma</th>
                                <th>Ações</th>
                            </tr>

                        </thead>

                        <tbody id="listaAlunos"></tbody>

                    </table>

                </div>

                <div
                    id="semAlunos"
                    class="text-center text-muted py-4"
                >
                    Nenhum aluno cadastrado.
                </div>

            </div>

        </div>

    </div>


    <!-- MODAL -->
    <div
        class="modal fade"
        id="modalAluno"
        tabindex="-1"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="tituloModal"
                    >
                        Cadastrar Aluno
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>


                <div class="modal-body">

                    <input
                        type="hidden"
                        id="indiceAluno"
                    >


                    <div class="mb-3">

                        <label class="form-label">
                            Nome completo
                        </label>

                        <input
                            type="text"
                            id="nome"
                            class="form-control"
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Matrícula
                        </label>

                        <input
                            type="text"
                            id="matricula"
                            class="form-control"
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Turma
                        </label>

                        <input
                            type="text"
                            id="turma"
                            class="form-control"
                            placeholder="Ex.: 8º Ano A"
                        >

                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancelar
                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        onclick="salvarAluno()"
                    >
                        Salvar
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- BOOTSTRAP -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- JAVASCRIPT -->
    <script>

        let alunos =
            JSON.parse(localStorage.getItem("alunos")) || [];


        const modal =
            new bootstrap.Modal(
                document.getElementById("modalAluno")
            );


        // ABRIR CADASTRO
        function abrirCadastro() {

            document.getElementById("tituloModal").innerText =
                "Cadastrar Aluno";

            document.getElementById("indiceAluno").value = "";

            document.getElementById("nome").value = "";
            document.getElementById("matricula").value = "";
            document.getElementById("turma").value = "";

            modal.show();

        }


        // SALVAR
        function salvarAluno() {

            const nome =
                document.getElementById("nome").value.trim();

            const matricula =
                document.getElementById("matricula").value.trim();

            const turma =
                document.getElementById("turma").value.trim();


            if (!nome || !matricula || !turma) {

                alert(
                    "Preencha o nome, matrícula e turma."
                );

                return;

            }


            const indice =
                document.getElementById("indiceAluno").value;


            const aluno = {

                nome: nome,
                matricula: matricula,
                turma: turma

            };


            if (indice === "") {

                alunos.push(aluno);

            } else {

                alunos[indice] = aluno;

            }


            localStorage.setItem(
                "alunos",
                JSON.stringify(alunos)
            );


            modal.hide();

            listarAlunos();

        }


        // LISTAR
        function listarAlunos() {

            const tabela =
                document.getElementById("listaAlunos");

            const semAlunos =
                document.getElementById("semAlunos");

            const pesquisa =
                document
                    .getElementById("pesquisa")
                    .value
                    .toLowerCase();


            tabela.innerHTML = "";


            const filtrados =
                alunos.filter(function(aluno) {

                    return (
                        aluno.nome
                            .toLowerCase()
                            .includes(pesquisa)
                        ||
                        aluno.matricula
                            .toLowerCase()
                            .includes(pesquisa)
                    );

                });


            if (filtrados.length === 0) {

                semAlunos.style.display = "block";

                return;

            }


            semAlunos.style.display = "none";


            filtrados.forEach(function(aluno) {

                const indice =
                    alunos.indexOf(aluno);


                tabela.innerHTML += `

                    <tr>

                        <td>
                            ${aluno.nome}
                        </td>

                        <td>
                            ${aluno.matricula}
                        </td>

                        <td>
                            ${aluno.turma}
                        </td>

                        <td>

                            <button
                                class="btn btn-sm btn-warning me-1"
                                onclick="editarAluno(${indice})"
                            >
                                Editar
                            </button>

                            <button
                                class="btn btn-sm btn-danger"
                                onclick="excluirAluno(${indice})"
                            >
                                Excluir
                            </button>

                        </td>

                    </tr>

                `;

            });

        }


        // EDITAR
        function editarAluno(indice) {

            const aluno = alunos[indice];


            document.getElementById("tituloModal").innerText =
                "Editar Aluno";

            document.getElementById("indiceAluno").value =
                indice;

            document.getElementById("nome").value =
                aluno.nome;

            document.getElementById("matricula").value =
                aluno.matricula;

            document.getElementById("turma").value =
                aluno.turma;


            modal.show();

        }


        // EXCLUIR
        function excluirAluno(indice) {

            const confirmar =
                confirm(
                    "Tem certeza que deseja excluir este aluno?"
                );


            if (!confirmar) {

                return;

            }


            alunos.splice(indice, 1);


            localStorage.setItem(
                "alunos",
                JSON.stringify(alunos)
            );


            listarAlunos();

        }


        // VOLTAR
        function voltar() {

            window.location.href = "dashboard.html";

        }


        // SAIR
        function sair() {

            window.location.href = "index.html";

        }


        // CARREGAR
        listarAlunos();

    </script>

</body>

</html>
