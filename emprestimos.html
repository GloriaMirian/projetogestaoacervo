<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ulysses Acervo - Empréstimos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- MENU -->
    <nav class="navbar navbar-dark bg-primary">

        <div class="container-fluid">

            <span class="navbar-brand fw-bold">
                📚 Ulysses Acervo
            </span>

            <div>

                <button
                    class="btn btn-light btn-sm me-2"
                    onclick="voltar()"
                >
                    ← Voltar
                </button>

                <button
                    class="btn btn-danger btn-sm"
                    onclick="sair()"
                >
                    Sair
                </button>

            </div>

        </div>

    </nav>


    <!-- CONTEÚDO -->
    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold">
                    🔄 Empréstimos
                </h2>

                <p class="text-muted">
                    Controle de empréstimos e devoluções
                </p>

            </div>

            <button
                class="btn btn-primary"
                onclick="abrirCadastro()"
            >
                + Novo Empréstimo
            </button>

        </div>


        <!-- RESUMO -->

        <div class="row g-3 mb-4">

            <div class="col-md-4">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <h6 class="text-muted">
                            Empréstimos ativos
                        </h6>

                        <h2
                            id="totalAtivos"
                            class="fw-bold"
                        >
                            0
                        </h2>

                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <h6 class="text-muted">
                            Devolvidos
                        </h6>

                        <h2
                            id="totalDevolvidos"
                            class="fw-bold"
                        >
                            0
                        </h2>

                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <h6 class="text-muted">
                            Total de empréstimos
                        </h6>

                        <h2
                            id="totalEmprestimos"
                            class="fw-bold"
                        >
                            0
                        </h2>

                    </div>

                </div>

            </div>

        </div>


        <!-- PESQUISA -->

        <div class="card shadow-sm border-0 mb-4">

            <div class="card-body">

                <label class="form-label fw-bold">
                    Pesquisar empréstimo
                </label>

                <input
                    type="text"
                    id="pesquisa"
                    class="form-control"
                    placeholder="Digite o nome do aluno ou livro..."
                    onkeyup="listarEmprestimos()"
                >

            </div>

        </div>


        <!-- LISTA -->

        <div class="card shadow-sm border-0">

            <div class="card-body">

                <h5 class="fw-bold mb-3">
                    Histórico de empréstimos
                </h5>

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-light">

                            <tr>

                                <th>Aluno</th>

                                <th>Livro</th>

                                <th>Empréstimo</th>

                                <th>Devolução prevista</th>

                                <th>Status</th>

                                <th>Ação</th>

                            </tr>

                        </thead>

                        <tbody id="listaEmprestimos"></tbody>

                    </table>

                </div>

                <div
                    id="semEmprestimos"
                    class="text-center text-muted py-4"
                >
                    Nenhum empréstimo registrado.
                </div>

            </div>

        </div>

    </div>


    <!-- MODAL -->

    <div
        class="modal fade"
        id="modalEmprestimo"
        tabindex="-1"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Novo Empréstimo
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>


                <div class="modal-body">


                    <!-- ALUNO -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Aluno
                        </label>

                        <select
                            id="aluno"
                            class="form-select"
                        >

                            <option value="">
                                Selecione o aluno
                            </option>

                        </select>

                    </div>


                    <!-- LIVRO -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Livro
                        </label>

                        <select
                            id="livro"
                            class="form-select"
                        >

                            <option value="">
                                Selecione o livro
                            </option>

                        </select>

                    </div>


                    <!-- DATA EMPRÉSTIMO -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Data do empréstimo
                        </label>

                        <input
                            type="date"
                            id="dataEmprestimo"
                            class="form-control"
                        >

                    </div>


                    <!-- DATA DEVOLUÇÃO -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Data prevista para devolução
                        </label>

                        <input
                            type="date"
                            id="dataDevolucao"
                            class="form-control"
                        >

                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancelar
                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        onclick="salvarEmprestimo()"
                    >
                        Registrar Empréstimo
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- BOOTSTRAP -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- JAVASCRIPT -->

    <script>

        
let alunos = [];
let livros = [];
let emprestimos = [];

async function carregarDados() {
    try {
        const [resAlunos, resLivros, resEmprestimos] = await Promise.all([
            fetch("/api/alunos"),
            fetch("/api/livros"),
            fetch("/api/emprestimos")
        ]);

        if (!resAlunos.ok || !resLivros.ok || !resEmprestimos.ok) {
            throw new Error("Não foi possível carregar os dados.");
        }

        alunos = await resAlunos.json();
        livros = await resLivros.json();
        emprestimos = await resEmprestimos.json();

        listarEmprestimos();
    } catch (erro) {
        console.error(erro);
        alert("Erro ao carregar os empréstimos. Verifique o servidor.");
    }
}

async function abrirCadastro() {
    await carregarDados();

    const selectAluno = document.getElementById("aluno");
    const selectLivro = document.getElementById("livro");

    selectAluno.innerHTML = '<option value="">Selecione um aluno</option>';
    selectLivro.innerHTML = '<option value="">Selecione um livro</option>';

    alunos.forEach(aluno => {
        selectAluno.innerHTML += `
            <option value="${aluno.id}">
                ${escaparHTML(aluno.nome)} - ${escaparHTML(aluno.matricula)}
            </option>
        `;
    });

    livros.forEach(livro => {
        const emprestados = emprestimos.filter(
            e => e.livro_id === livro.id && e.status === "Emprestado"
        ).length;

        const disponiveis = livro.quantidade - emprestados;

        if (disponiveis > 0) {
            selectLivro.innerHTML += `
                <option value="${livro.id}">
                    ${escaparHTML(livro.titulo)} (${disponiveis} disponíveis)
                </option>
            `;
        }
    });

    definirDatas();

    const modal = new bootstrap.Modal(
        document.getElementById("modalEmprestimo")
    );

    modal.show();
}

function definirDatas() {
    const hoje = new Date();
    const devolucao = new Date();

    devolucao.setDate(hoje.getDate() + 7);

    document.getElementById("dataEmprestimo").value =
        hoje.toISOString().split("T")[0];

    document.getElementById("dataDevolucao").value =
        devolucao.toISOString().split("T")[0];
}

async function salvarEmprestimo() {
    const alunoId = document.getElementById("aluno").value;
    const livroId = document.getElementById("livro").value;
    const dataEmprestimo = document.getElementById("dataEmprestimo").value;
    const dataDevolucao = document.getElementById("dataDevolucao").value;

    if (!alunoId || !livroId || !dataEmprestimo || !dataDevolucao) {
        alert("Preencha todos os campos.");
        return;
    }

    if (dataDevolucao < dataEmprestimo) {
        alert("A data de devolução não pode ser anterior ao empréstimo.");
        return;
    }

    try {
        const resposta = await fetch("/api/emprestimos", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                aluno_id: Number(alunoId),
                livro_id: Number(livroId),
                data_emprestimo: dataEmprestimo,
                data_devolucao_prevista: dataDevolucao
            })
        });

        const resultado = await resposta.json();

        if (!resposta.ok) {
            throw new Error(resultado.erro || "Erro ao cadastrar empréstimo.");
        }

        alert("Empréstimo cadastrado com sucesso!");

        const modalElemento = document.getElementById("modalEmprestimo");
        bootstrap.Modal.getInstance(modalElemento)?.hide();

        await carregarDados();

    } catch (erro) {
        alert(erro.message);
    }
}

async function listarEmprestimos() {
    try {
        const resposta = await fetch("/api/emprestimos");

        if (!resposta.ok) {
            throw new Error("Erro ao consultar empréstimos.");
        }

        emprestimos = await resposta.json();

        const pesquisa = document.getElementById("pesquisa")
            .value.toLowerCase();

        const lista = document.getElementById("listaEmprestimos");
        const semEmprestimos = document.getElementById("semEmprestimos");

        const filtrados = emprestimos.filter(e =>
            e.aluno.toLowerCase().includes(pesquisa) ||
            e.livro.toLowerCase().includes(pesquisa)
        );

        lista.innerHTML = "";

        filtrados.forEach(e => {
            const linha = document.createElement("tr");

            linha.innerHTML = `
                <td>${escaparHTML(e.aluno)}</td>
                <td>${escaparHTML(e.livro)}</td>
                <td>${formatarData(e.data_emprestimo)}</td>
                <td>${formatarData(e.data_devolucao_prevista)}</td>
                <td>
                    <span class="badge ${
    e.status === "Devolvido"
        ? "bg-success"
        : estaAtrasado(e.data_devolucao_prevista, e.status)
            ? "bg-danger"
            : "bg-warning text-dark"
}">
    ${
        e.status === "Devolvido"
            ? "Devolvido"
            : estaAtrasado(e.data_devolucao_prevista, e.status)
                ? "Atrasado"
                : "Emprestado"
    }
</span>
                </td>
                <td>
                    ${
                        e.status === "Emprestado"
                            ? `<button class="btn btn-sm btn-success"
                                onclick="registrarDevolucao(${e.id})">
                                Devolver
                               </button>`
                            : '<span class="text-muted">Finalizado</span>'
                    }
                </td>
            `;

            lista.appendChild(linha);
        });

        semEmprestimos.style.display =
            filtrados.length === 0 ? "block" : "none";

        atualizarResumo();

    } catch (erro) {
        console.error(erro);
        alert("Não foi possível listar os empréstimos.");
    }
}

async function registrarDevolucao(id) {
    if (!confirm("Deseja registrar a devolução deste livro?")) {
        return;
    }

    try {
        const resposta = await fetch(
            `/api/emprestimos/${id}/devolucao`,
            { method: "PUT" }
        );

        const resultado = await resposta.json();

        if (!resposta.ok) {
            throw new Error(resultado.erro || "Erro ao registrar devolução.");
        }

        alert("Devolução registrada com sucesso!");

        await carregarDados();

    } catch (erro) {
        alert(erro.message);
    }
}

function atualizarResumo() {
    const ativos = emprestimos.filter(
        e => e.status === "Emprestado"
    ).length;

    const devolvidos = emprestimos.filter(
        e => e.status === "Devolvido"
    ).length;

    document.getElementById("totalAtivos").textContent = ativos;
    document.getElementById("totalDevolvidos").textContent = devolvidos;
    document.getElementById("totalEmprestimos").textContent =
        emprestimos.length;
}

function formatarData(data) {
    if (!data) return "-";

    const [ano, mes, dia] = data.split("-");
    return `${dia}/${mes}/${ano}`;
}
function estaAtrasado(dataDevolucao, status) {
    if (status !== "Emprestado") {
        return false;
    }

    const hoje = new Date();
    hoje.setHours(0, 0, 0, 0);

    const dataPrevista = new Date(`${dataDevolucao}T00:00:00`);

    return dataPrevista < hoje;
}
function escaparHTML(valor) {
    return String(valor ?? "").replace(/[&<>"']/g, caractere => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[caractere]);
}
function voltar() {
    window.location.href = "/dashboard.html";
}

function sair() {
    window.location.href = "/";
}

// Inicialização da página
document.addEventListener("DOMContentLoaded", carregarDados);


    </script>

</body>

</html>
