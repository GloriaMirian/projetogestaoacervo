<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ulysses Acervo - Livros</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- MENU -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">

            <span class="navbar-brand fw-bold">
                📚 Ulysses Acervo
            </span>

            <button
                class="btn btn-light btn-sm"
                onclick="window.location.href='dashboard.html'"
            >
                Voltar
            </button>

        </div>
    </nav>


    <!-- CONTEÚDO -->
    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="fw-bold">
                    Livros
                </h2>

                <p class="text-muted">
                    Gerenciamento do acervo
                </p>
            </div>

            <button
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#modalLivro"
            >
                + Novo Livro
            </button>

        </div>


        <!-- PESQUISA -->
        <div class="card shadow-sm border-0 mb-4">

            <div class="card-body">

                <input
                    type="text"
                    id="pesquisa"
                    class="form-control"
                    placeholder="Pesquisar por título ou autor..."
                    onkeyup="pesquisarLivros()"
                >

            </div>

        </div>


        <!-- TABELA -->
        <div class="card shadow-sm border-0">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead>

                            <tr>
                                <th>Título</th>
                                <th>Autor</th>
                                <th>ISBN</th>
                                <th>Quantidade</th>
                                <th>Ações</th>
                            </tr>

                        </thead>

                        <tbody id="listaLivros">

                            <!-- Livros aparecerão aqui -->

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <!-- MODAL CADASTRO -->
    <div
        class="modal fade"
        id="modalLivro"
        tabindex="-1"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Cadastrar Livro
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>


                <div class="modal-body">

                    <form id="formLivro">

                        <div class="mb-3">

                            <label class="form-label">
                                Título
                            </label>

                            <input
                                type="text"
                                id="titulo"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Autor
                            </label>

                            <input
                                type="text"
                                id="autor"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                ISBN
                            </label>

                            <input
                                type="text"
                                id="isbn"
                                class="form-control"
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Quantidade
                            </label>

                            <input
                                type="number"
                                id="quantidade"
                                class="form-control"
                                min="1"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Cadastrar Livro
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>


    <!-- BOOTSTRAP -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- JAVASCRIPT -->
    <script>

        let livros = [];


        document
            .getElementById("formLivro")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const titulo =
                    document.getElementById("titulo").value;

                const autor =
                    document.getElementById("autor").value;

                const isbn =
                    document.getElementById("isbn").value;

                const quantidade =
                    document.getElementById("quantidade").value;


                const livro = {

                    titulo: titulo,
                    autor: autor,
                    isbn: isbn,
                    quantidade: quantidade

                };


                livros.push(livro);


                mostrarLivros();


                document
                    .getElementById("formLivro")
                    .reset();


                const modal =
                    bootstrap.Modal.getInstance(
                        document.getElementById("modalLivro")
                    );

                modal.hide();

            });


        function mostrarLivros() {

            const lista =
                document.getElementById("listaLivros");

            lista.innerHTML = "";


            livros.forEach(function(livro, index) {

                lista.innerHTML += `

                    <tr>

                        <td>
                            ${livro.titulo}
                        </td>

                        <td>
                            ${livro.autor}
                        </td>

                        <td>
                            ${livro.isbn || "-"}
                        </td>

                        <td>
                            ${livro.quantidade}
                        </td>

                        <td>

                            <button
                                class="btn btn-danger btn-sm"
                                onclick="excluirLivro(${index})"
                            >
                                Excluir
                            </button>

                        </td>

                    </tr>

                `;

            });

        }


        function excluirLivro(index) {

            if (confirm("Deseja excluir este livro?")) {

                livros.splice(index, 1);

                mostrarLivros();

            }

        }


        function pesquisarLivros() {

            const pesquisa =
                document
                    .getElementById("pesquisa")
                    .value
                    .toLowerCase();


            const linhas =
                document.querySelectorAll("#listaLivros tr");


            linhas.forEach(function(linha) {

                const texto =
                    linha.innerText.toLowerCase();


                if (texto.includes(pesquisa)) {

                    linha.style.display = "";

                } else {

                    linha.style.display = "none";

                }

            });

        }

    </script>

</body>

</html>
