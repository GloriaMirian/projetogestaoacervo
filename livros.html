<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ulysses Acervo - Livros</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- MENU -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">

            <span class="navbar-brand fw-bold">
                📚 Ulysses Acervo
            </span>

            <div>
                <button
                    class="btn btn-light btn-sm me-2"
                    onclick="voltar()"
                >
                    ← Voltar
                </button>

                <button
                    class="btn btn-danger btn-sm"
                    onclick="sair()"
                >
                    Sair
                </button>
            </div>

        </div>
    </nav>


    <!-- CONTEÚDO -->
    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="fw-bold">
                    📚 Livros
                </h2>

                <p class="text-muted">
                    Gerenciamento do acervo
                </p>
            </div>

            <button
                class="btn btn-primary"
                onclick="abrirCadastro()"
            >
                + Cadastrar Livro
            </button>

        </div>


        <!-- PESQUISA -->
        <div class="card shadow-sm border-0 mb-4">

            <div class="card-body">

                <label class="form-label fw-bold">
                    Pesquisar livro
                </label>

                <input
                    type="text"
                    id="pesquisa"
                    class="form-control"
                    placeholder="Digite o título ou autor..."
                    onkeyup="listarLivros()"
                >

            </div>

        </div>


        <!-- LISTA DE LIVROS -->
        <div class="card shadow-sm border-0">

            <div class="card-body">

                <h5 class="fw-bold mb-3">
                    Livros cadastrados
                </h5>

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-light">
    <tr>
        <th>Título</th>
        <th>Autor</th>
        <th>Categoria</th>
        <th>Ano</th>
        <th>Quantidade total</th>
        <th>Emprestados</th>
        <th>Disponíveis</th>
        <th>Ações</th>
    </tr>
</thead>


                        <tbody id="listaLivros"></tbody>

                    </table>

                </div>

                <div
                    id="semLivros"
                    class="text-center text-muted py-4"
                >
                    Nenhum livro cadastrado.
                </div>

            </div>

        </div>

    </div>


    <!-- MODAL CADASTRO -->
    <div
        class="modal fade"
        id="modalLivro"
        tabindex="-1"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="tituloModal"
                    >
                        Cadastrar Livro
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>


                <div class="modal-body">

                    <input
                        type="hidden"
                        id="indiceLivro"
                    >


                    <div class="mb-3">

                        <label class="form-label">
                            Título
                        </label>

                        <input
                            type="text"
                            id="titulo"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Autor
                        </label>

                        <input
                            type="text"
                            id="autor"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Categoria
                        </label>

                        <input
                            type="text"
                            id="categoria"
                            class="form-control"
                            placeholder="Ex.: Literatura"
                        >

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Ano
                            </label>

                            <input
                                type="number"
                                id="ano"
                                class="form-control"
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Quantidade
                            </label>

                            <input
                                type="number"
                                id="quantidade"
                                class="form-control"
                                min="1"
                                value="1"
                            >

                        </div>

                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancelar
                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        onclick="salvarLivro()"
                    >
                        Salvar
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- BOOTSTRAP -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- JAVASCRIPT -->
    <script>

       
let livros = [];

const modal = new bootstrap.Modal(
    document.getElementById("modalLivro")
);

// Mensagens de erro da API
async function requisicaoAPI(url, opcoes = {}) {
    const resposta = await fetch(url, {
        ...opcoes,
        headers: {
            "Content-Type": "application/json",
            ...(opcoes.headers || {})
        }
    });

    const dados = await resposta.json().catch(() => ({}));

    if (!resposta.ok) {
        throw new Error(dados.erro || "Não foi possível concluir a operação.");
    }

    return dados;
}

// ABRIR CADASTRO
function abrirCadastro() {
    document.getElementById("tituloModal").innerText = "Cadastrar Livro";
    document.getElementById("indiceLivro").value = "";
    document.getElementById("titulo").value = "";
    document.getElementById("autor").value = "";
    document.getElementById("categoria").value = "";
    document.getElementById("ano").value = "";
    document.getElementById("quantidade").value = "1";

    modal.show();
}

// SALVAR OU ATUALIZAR LIVRO
async function salvarLivro() {
    const titulo = document.getElementById("titulo").value.trim();
    const autor = document.getElementById("autor").value.trim();
    const categoria = document.getElementById("categoria").value.trim();
    const ano = document.getElementById("ano").value;
    const quantidade = document.getElementById("quantidade").value;
    const id = document.getElementById("indiceLivro").value;

    if (!titulo || !autor) {
        alert("Preencha o título e o autor.");
        return;
    }

    const livro = {
        titulo,
        autor,
        categoria,
        ano,
        quantidade
    };

    try {
        if (id === "") {
            await requisicaoAPI("/api/livros", {
                method: "POST",
                body: JSON.stringify(livro)
            });
        } else {
            await requisicaoAPI(`/api/livros/${id}`, {
                method: "PUT",
                body: JSON.stringify(livro)
            });
        }

        modal.hide();
        await listarLivros();
        alert("Livro salvo com sucesso!");
    } catch (erro) {
        alert(erro.message);
    }
}

// LISTAR LIVROS

// LISTAR LIVROS E CALCULAR DISPONIBILIDADE
async function listarLivros() {
    const tabela = document.getElementById("listaLivros");
    const semLivros = document.getElementById("semLivros");
    const pesquisa = document.getElementById("pesquisa").value
        .trim()
        .toLowerCase();

    try {
        // Consultar livros e empréstimos
        const [dadosLivros, emprestimos] = await Promise.all([
            requisicaoAPI("/api/livros"),
            requisicaoAPI("/api/emprestimos")
        ]);

        livros = dadosLivros;
        tabela.innerHTML = "";

        // Contar empréstimos ativos por livro
        const emprestimosPorLivro = {};

        emprestimos
            .filter(e => e.status === "Emprestado")
            .forEach(e => {
                const idLivro = String(e.livro_id);

                emprestimosPorLivro[idLivro] =
                    (emprestimosPorLivro[idLivro] || 0) + 1;
            });

        // Filtrar livros pela pesquisa
        const filtrados = livros.filter(livro =>
            livro.titulo.toLowerCase().includes(pesquisa) ||
            livro.autor.toLowerCase().includes(pesquisa)
        );

        if (filtrados.length === 0) {
            semLivros.style.display = "block";
            return;
        }

        semLivros.style.display = "none";

        filtrados.forEach(livro => {
            const linha = document.createElement("tr");

            const quantidadeTotal = Number(livro.quantidade || 0);

            const emprestados =
                emprestimosPorLivro[String(livro.id)] || 0;

            const disponiveis = Math.max(
                0,
                quantidadeTotal - emprestados
            );

            const valores = [
                livro.titulo,
                livro.autor,
                livro.categoria || "-",
                livro.ano || "-",
                quantidadeTotal,
                emprestados,
                disponiveis
            ];

            valores.forEach((valor, indice) => {
                const celula = document.createElement("td");
                celula.textContent = valor;

                if (indice === 6) {
                    celula.classList.add(
                        disponiveis > 0 ? "text-success" : "text-danger",
                        "fw-bold"
                    );
                }

                linha.appendChild(celula);
            });

            // Ações
            const acoes = document.createElement("td");

            const botaoEditar = document.createElement("button");
            botaoEditar.className = "btn btn-sm btn-warning me-1";
            botaoEditar.textContent = "Editar";
            botaoEditar.addEventListener(
                "click",
                () => editarLivro(livro.id)
            );

            const botaoExcluir = document.createElement("button");
            botaoExcluir.className = "btn btn-sm btn-danger";
            botaoExcluir.textContent = "Excluir";
            botaoExcluir.addEventListener(
                "click",
                () => excluirLivro(livro.id)
            );

            acoes.append(botaoEditar, botaoExcluir);
            linha.appendChild(acoes);

            tabela.appendChild(linha);
        });

    } catch (erro) {
        console.error(erro);
        semLivros.style.display = "block";

        alert(
            "Erro ao carregar os livros: " + erro.message
        );
    }
}


// EDITAR LIVRO
function editarLivro(id) {
    const livro = livros.find(item => item.id === id);

    if (!livro) {
        alert("Livro não encontrado.");
        return;
    }

    document.getElementById("tituloModal").innerText = "Editar Livro";
    document.getElementById("indiceLivro").value = livro.id;
    document.getElementById("titulo").value = livro.titulo;
    document.getElementById("autor").value = livro.autor;
    document.getElementById("categoria").value = livro.categoria || "";
    document.getElementById("ano").value = livro.ano || "";
    document.getElementById("quantidade").value = livro.quantidade;

    modal.show();
}

// EXCLUIR LIVRO
async function excluirLivro(id) {
    if (!confirm("Tem certeza que deseja excluir este livro?")) {
        return;
    }

    try {
        await requisicaoAPI(`/api/livros/${id}`, {
            method: "DELETE"
        });

        await listarLivros();
        alert("Livro excluído com sucesso!");
    } catch (erro) {
        alert(erro.message);
    }
}

// VOLTAR
function voltar() {
    window.location.href = "dashboard.html";
}

// SAIR
function sair() {
    window.location.href = "index.html";
}

// PESQUISA E CARREGAMENTO INICIAL
document.getElementById("pesquisa").addEventListener("input", listarLivros);
listarLivros();


    </script>

</body>

</html>
