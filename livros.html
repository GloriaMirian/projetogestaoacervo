<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ulysses Acervo - Livros</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- MENU -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">

            <span class="navbar-brand fw-bold">
                📚 Ulysses Acervo
            </span>

            <div>
                <button
                    class="btn btn-light btn-sm me-2"
                    onclick="voltar()"
                >
                    ← Voltar
                </button>

                <button
                    class="btn btn-danger btn-sm"
                    onclick="sair()"
                >
                    Sair
                </button>
            </div>

        </div>
    </nav>


    <!-- CONTEÚDO -->
    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="fw-bold">
                    📚 Livros
                </h2>

                <p class="text-muted">
                    Gerenciamento do acervo
                </p>
            </div>

            <button
                class="btn btn-primary"
                onclick="abrirCadastro()"
            >
                + Cadastrar Livro
            </button>

        </div>


        <!-- PESQUISA -->
        <div class="card shadow-sm border-0 mb-4">

            <div class="card-body">

                <label class="form-label fw-bold">
                    Pesquisar livro
                </label>

                <input
                    type="text"
                    id="pesquisa"
                    class="form-control"
                    placeholder="Digite o título ou autor..."
                    onkeyup="listarLivros()"
                >

            </div>

        </div>


        <!-- LISTA DE LIVROS -->
        <div class="card shadow-sm border-0">

            <div class="card-body">

                <h5 class="fw-bold mb-3">
                    Livros cadastrados
                </h5>

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-light">

                            <tr>
                                <th>Título</th>
                                <th>Autor</th>
                                <th>Categoria</th>
                                <th>Ano</th>
                                <th>Quantidade</th>
                                <th>Ações</th>
                            </tr>

                        </thead>

                        <tbody id="listaLivros"></tbody>

                    </table>

                </div>

                <div
                    id="semLivros"
                    class="text-center text-muted py-4"
                >
                    Nenhum livro cadastrado.
                </div>

            </div>

        </div>

    </div>


    <!-- MODAL CADASTRO -->
    <div
        class="modal fade"
        id="modalLivro"
        tabindex="-1"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="tituloModal"
                    >
                        Cadastrar Livro
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>


                <div class="modal-body">

                    <input
                        type="hidden"
                        id="indiceLivro"
                    >


                    <div class="mb-3">

                        <label class="form-label">
                            Título
                        </label>

                        <input
                            type="text"
                            id="titulo"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Autor
                        </label>

                        <input
                            type="text"
                            id="autor"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Categoria
                        </label>

                        <input
                            type="text"
                            id="categoria"
                            class="form-control"
                            placeholder="Ex.: Literatura"
                        >

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Ano
                            </label>

                            <input
                                type="number"
                                id="ano"
                                class="form-control"
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Quantidade
                            </label>

                            <input
                                type="number"
                                id="quantidade"
                                class="form-control"
                                min="1"
                                value="1"
                            >

                        </div>

                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancelar
                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        onclick="salvarLivro()"
                    >
                        Salvar
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- BOOTSTRAP -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- JAVASCRIPT -->
    <script>

        let livros = JSON.parse(localStorage.getItem("livros")) || [];

        const modal = new bootstrap.Modal(
            document.getElementById("modalLivro")
        );


        // ABRIR CADASTRO
        function abrirCadastro() {

            document.getElementById("tituloModal").innerText =
                "Cadastrar Livro";

            document.getElementById("indiceLivro").value = "";

            document.getElementById("titulo").value = "";
            document.getElementById("autor").value = "";
            document.getElementById("categoria").value = "";
            document.getElementById("ano").value = "";
            document.getElementById("quantidade").value = "1";

            modal.show();

        }


        // SALVAR LIVRO
        function salvarLivro() {

            const titulo =
                document.getElementById("titulo").value.trim();

            const autor =
                document.getElementById("autor").value.trim();

            const categoria =
                document.getElementById("categoria").value.trim();

            const ano =
                document.getElementById("ano").value;

            const quantidade =
                document.getElementById("quantidade").value;


            if (!titulo || !autor) {

                alert("Preencha o título e o autor.");

                return;

            }


            const indice =
                document.getElementById("indiceLivro").value;


            const livro = {

                titulo: titulo,
                autor: autor,
                categoria: categoria,
                ano: ano,
                quantidade: quantidade

            };


            if (indice === "") {

                livros.push(livro);

            } else {

                livros[indice] = livro;

            }


            localStorage.setItem(
                "livros",
                JSON.stringify(livros)
            );


            modal.hide();

            listarLivros();

        }


        // LISTAR LIVROS
        function listarLivros() {

            const tabela =
                document.getElementById("listaLivros");

            const semLivros =
                document.getElementById("semLivros");

            const pesquisa =
                document
                    .getElementById("pesquisa")
                    .value
                    .toLowerCase();


            tabela.innerHTML = "";


            const filtrados = livros.filter(function(livro) {

                return (
                    livro.titulo.toLowerCase().includes(pesquisa) ||
                    livro.autor.toLowerCase().includes(pesquisa)
                );

            });


            if (filtrados.length === 0) {

                semLivros.style.display = "block";

                return;

            }


            semLivros.style.display = "none";


            filtrados.forEach(function(livro) {

                const indice =
                    livros.indexOf(livro);


                tabela.innerHTML += `

                    <tr>

                        <td>
                            ${livro.titulo}
                        </td>

                        <td>
                            ${livro.autor}
                        </td>

                        <td>
                            ${livro.categoria || "-"}
                        </td>

                        <td>
                            ${livro.ano || "-"}
                        </td>

                        <td>
                            ${livro.quantidade}
                        </td>

                        <td>

                            <button
                                class="btn btn-sm btn-warning me-1"
                                onclick="editarLivro(${indice})"
                            >
                                Editar
                            </button>

                            <button
                                class="btn btn-sm btn-danger"
                                onclick="excluirLivro(${indice})"
                            >
                                Excluir
                            </button>

                        </td>

                    </tr>

                `;

            });

        }


        // EDITAR LIVRO
        function editarLivro(indice) {

            const livro = livros[indice];


            document.getElementById("tituloModal").innerText =
                "Editar Livro";

            document.getElementById("indiceLivro").value =
                indice;

            document.getElementById("titulo").value =
                livro.titulo;

            document.getElementById("autor").value =
                livro.autor;

            document.getElementById("categoria").value =
                livro.categoria;

            document.getElementById("ano").value =
                livro.ano;

            document.getElementById("quantidade").value =
                livro.quantidade;


            modal.show();

        }


        // EXCLUIR LIVRO
        function excluirLivro(indice) {

            const confirmar =
                confirm(
                    "Tem certeza que deseja excluir este livro?"
                );


            if (!confirmar) {

                return;

            }


            livros.splice(indice, 1);


            localStorage.setItem(
                "livros",
                JSON.stringify(livros)
            );


            listarLivros();

        }


        // VOLTAR
        function voltar() {

            window.location.href = "dashboard.html";

        }


        // SAIR
        function sair() {

            window.location.href = "index.html";

        }


        // CARREGAR LIVROS AO ABRIR A PÁGINA
        listarLivros();

    </script>

</body>

</html>
