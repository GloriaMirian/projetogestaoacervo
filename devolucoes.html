<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ulysses Acervo - Devoluções</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- MENU SUPERIOR -->
    <nav class="navbar navbar-dark bg-primary">

        <div class="container-fluid">

            <span class="navbar-brand fw-bold">
                📚 Ulysses Acervo
            </span>

            <div>

                <button
                    class="btn btn-light btn-sm me-2"
                    onclick="voltar()"
                >
                    ← Voltar
                </button>

                <button
                    class="btn btn-danger btn-sm"
                    onclick="sair()"
                >
                    Sair
                </button>

            </div>

        </div>

    </nav>


    <!-- CONTEÚDO -->
    <div class="container mt-4">

        <!-- TÍTULO -->

        <div class="mb-4">

            <h2 class="fw-bold">
                📋 Devoluções
            </h2>

            <p class="text-muted">
                Histórico de livros devolvidos
            </p>

        </div>


        <!-- INDICADORES -->

        <div class="row g-4 mb-4">

            <!-- TOTAL DE DEVOLUÇÕES -->

            <div class="col-md-4">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <div class="fs-1">
                            📋
                        </div>

                        <h6 class="text-muted">
                            Total de devoluções
                        </h6>

                        <h2
                            class="fw-bold"
                            id="totalDevolucoes"
                        >
                            0
                        </h2>

                    </div>

                </div>

            </div>


            <!-- DEVOLUÇÕES HOJE -->

            <div class="col-md-4">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <div class="fs-1">
                            📅
                        </div>

                        <h6 class="text-muted">
                            Devoluções hoje
                        </h6>

                        <h2
                            class="fw-bold"
                            id="devolucoesHoje"
                        >
                            0
                        </h2>

                    </div>

                </div>

            </div>


            <!-- TOTAL DE LIVROS DEVOLVIDOS -->

            <div class="col-md-4">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <div class="fs-1">
                            📚
                        </div>

                        <h6 class="text-muted">
                            Livros devolvidos
                        </h6>

                        <h2
                            class="fw-bold"
                            id="livrosDevolvidos"
                        >
                            0
                        </h2>

                    </div>

                </div>

            </div>

        </div>


        <!-- PESQUISA -->

        <div class="card shadow-sm border-0 mb-4">

            <div class="card-body">

                <label class="form-label fw-bold">
                    Pesquisar devolução
                </label>

                <input
                    type="text"
                    id="pesquisa"
                    class="form-control"
                    placeholder="Digite o nome do aluno ou livro..."
                    onkeyup="listarDevolucoes()"
                >

            </div>

        </div>


        <!-- TABELA -->

        <div class="card shadow-sm border-0">

            <div class="card-body">

                <h5 class="fw-bold mb-3">
                    Histórico de devoluções
                </h5>


                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-light">

                            <tr>

                                <th>Aluno</th>

                                <th>Matrícula</th>

                                <th>Livro</th>

                                <th>Data do empréstimo</th>

                                <th>Data prevista</th>

                                <th>Data da devolução</th>

                                <th>Status</th>

                            </tr>

                        </thead>


                        <tbody id="listaDevolucoes"></tbody>

                    </table>

                </div>


                <div
                    id="semDevolucoes"
                    class="text-center text-muted py-4"
                >
                    Nenhuma devolução registrada.
                </div>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

       
let emprestimos = [];

async function carregarDevolucoes() {
    try {
        const resposta = await fetch("/api/emprestimos");

        if (!resposta.ok) {
            throw new Error("Erro ao consultar devoluções.");
        }

        emprestimos = await resposta.json();

        listarDevolucoes();

    } catch (erro) {
        console.error(erro);
        alert("Não foi possível carregar o histórico de devoluções.");
    }
}

function listarDevolucoes() {
    const tabela = document.getElementById("listaDevolucoes");
    const mensagem = document.getElementById("semDevolucoes");

    const pesquisa = document
        .getElementById("pesquisa")
        .value.toLowerCase();

    tabela.innerHTML = "";

    // Somente empréstimos devolvidos
    const devolucoes = emprestimos.filter(
        emprestimo => emprestimo.status === "Devolvido"
    );

    // Pesquisa por aluno, livro ou matrícula
    const filtradas = devolucoes.filter(devolucao =>
        (devolucao.aluno || "").toLowerCase().includes(pesquisa) ||
        (devolucao.livro || "").toLowerCase().includes(pesquisa) ||
        (devolucao.matricula || "").toLowerCase().includes(pesquisa)
    );

    mensagem.style.display =
        filtradas.length === 0 ? "block" : "none";

    filtradas.forEach(devolucao => {
        const linha = document.createElement("tr");

        linha.innerHTML = `
            <td>${escaparHTML(devolucao.aluno)}</td>
            <td>${escaparHTML(devolucao.matricula)}</td>
            <td>${escaparHTML(devolucao.livro)}</td>
            <td>${formatarData(devolucao.data_emprestimo)}</td>
            <td>${formatarData(devolucao.data_devolucao_prevista)}</td>
            <td>${formatarData(devolucao.data_devolucao_real)}</td>
            <td>
                <span class="badge bg-success">Devolvido</span>
            </td>
        `;

        tabela.appendChild(linha);
    });

    atualizarIndicadores(devolucoes);
}

function atualizarIndicadores(devolucoes) {
    // Total de devoluções
    document.getElementById("totalDevolucoes").textContent =
        devolucoes.length;

    // Data atual no horário local
    const hoje = obterDataLocal();

    // Devoluções realizadas hoje
    const hojeTotal = devolucoes.filter(devolucao =>
        devolucao.data_devolucao_real === hoje
    ).length;

    document.getElementById("devolucoesHoje").textContent =
        hojeTotal;

    // Total de livros devolvidos
    document.getElementById("livrosDevolvidos").textContent =
        devolucoes.length;
}

function obterDataLocal() {
    const hoje = new Date();
    const ano = hoje.getFullYear();
    const mes = String(hoje.getMonth() + 1).padStart(2, "0");
    const dia = String(hoje.getDate()).padStart(2, "0");

    return `${ano}-${mes}-${dia}`;
}

function formatarData(data) {
    if (!data) return "-";

    const partes = data.split("-");

    if (partes.length !== 3) return data;

    return `${partes[2]}/${partes[1]}/${partes[0]}`;
}

function escaparHTML(valor) {
    return String(valor ?? "").replace(/[&<>"']/g, caractere => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[caractere]);
}

function voltar() {
    window.location.href = "/dashboard.html";
}

function sair() {
    window.location.href = "/";
}

document.addEventListener("DOMContentLoaded", carregarDevolucoes);


    </script>

</body>

</html>
