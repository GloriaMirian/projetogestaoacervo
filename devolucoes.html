<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ulysses Acervo - Devoluções</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- MENU SUPERIOR -->
    <nav class="navbar navbar-dark bg-primary">

        <div class="container-fluid">

            <span class="navbar-brand fw-bold">
                📚 Ulysses Acervo
            </span>

            <div>

                <button
                    class="btn btn-light btn-sm me-2"
                    onclick="voltar()"
                >
                    ← Voltar
                </button>

                <button
                    class="btn btn-danger btn-sm"
                    onclick="sair()"
                >
                    Sair
                </button>

            </div>

        </div>

    </nav>


    <!-- CONTEÚDO -->
    <div class="container mt-4">

        <!-- TÍTULO -->

        <div class="mb-4">

            <h2 class="fw-bold">
                📋 Devoluções
            </h2>

            <p class="text-muted">
                Histórico de livros devolvidos
            </p>

        </div>


        <!-- INDICADORES -->

        <div class="row g-4 mb-4">

            <!-- TOTAL DE DEVOLUÇÕES -->

            <div class="col-md-4">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <div class="fs-1">
                            📋
                        </div>

                        <h6 class="text-muted">
                            Total de devoluções
                        </h6>

                        <h2
                            class="fw-bold"
                            id="totalDevolucoes"
                        >
                            0
                        </h2>

                    </div>

                </div>

            </div>


            <!-- DEVOLUÇÕES HOJE -->

            <div class="col-md-4">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <div class="fs-1">
                            📅
                        </div>

                        <h6 class="text-muted">
                            Devoluções hoje
                        </h6>

                        <h2
                            class="fw-bold"
                            id="devolucoesHoje"
                        >
                            0
                        </h2>

                    </div>

                </div>

            </div>


            <!-- TOTAL DE LIVROS DEVOLVIDOS -->

            <div class="col-md-4">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <div class="fs-1">
                            📚
                        </div>

                        <h6 class="text-muted">
                            Livros devolvidos
                        </h6>

                        <h2
                            class="fw-bold"
                            id="livrosDevolvidos"
                        >
                            0
                        </h2>

                    </div>

                </div>

            </div>

        </div>


        <!-- PESQUISA -->

        <div class="card shadow-sm border-0 mb-4">

            <div class="card-body">

                <label class="form-label fw-bold">
                    Pesquisar devolução
                </label>

                <input
                    type="text"
                    id="pesquisa"
                    class="form-control"
                    placeholder="Digite o nome do aluno ou livro..."
                    onkeyup="listarDevolucoes()"
                >

            </div>

        </div>


        <!-- TABELA -->

        <div class="card shadow-sm border-0">

            <div class="card-body">

                <h5 class="fw-bold mb-3">
                    Histórico de devoluções
                </h5>


                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-light">

                            <tr>

                                <th>Aluno</th>

                                <th>Matrícula</th>

                                <th>Livro</th>

                                <th>Data do empréstimo</th>

                                <th>Data prevista</th>

                                <th>Data da devolução</th>

                                <th>Status</th>

                            </tr>

                        </thead>


                        <tbody id="listaDevolucoes"></tbody>

                    </table>

                </div>


                <div
                    id="semDevolucoes"
                    class="text-center text-muted py-4"
                >
                    Nenhuma devolução registrada.
                </div>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        // CARREGAR EMPRÉSTIMOS

        let emprestimos =
            JSON.parse(
                localStorage.getItem("emprestimos")
            ) || [];


        // LISTAR DEVOLUÇÕES

        function listarDevolucoes() {

            const tabela =
                document.getElementById(
                    "listaDevolucoes"
                );


            const mensagem =
                document.getElementById(
                    "semDevolucoes"
                );


            const pesquisa =
                document
                    .getElementById("pesquisa")
                    .value
                    .toLowerCase();


            tabela.innerHTML = "";


            // SOMENTE DEVOLVIDOS

            const devolucoes =
                emprestimos.filter(function(
                    emprestimo
                ) {

                    return (
                        emprestimo.status ===
                        "Devolvido"
                    );

                });


            // PESQUISA

            const filtradas =
                devolucoes.filter(function(
                    devolucao
                ) {

                    return (

                        devolucao.aluno
                            .toLowerCase()
                            .includes(pesquisa)

                        ||

                        devolucao.livro
                            .toLowerCase()
                            .includes(pesquisa)

                        ||

                        devolucao.matricula
                            .toLowerCase()
                            .includes(pesquisa)

                    );

                });


            // NENHUMA DEVOLUÇÃO

            if (filtradas.length === 0) {

                mensagem.style.display =
                    "block";

            } else {

                mensagem.style.display =
                    "none";

            }


            // MONTAR TABELA

            filtradas.forEach(function(
                devolucao
            ) {

                tabela.innerHTML += `

                    <tr>

                        <td>
                            ${devolucao.aluno}
                        </td>

                        <td>
                            ${devolucao.matricula}
                        </td>

                        <td>
                            ${devolucao.livro}
                        </td>

                        <td>
                            ${formatarData(
                                devolucao.dataEmprestimo
                            )}
                        </td>

                        <td>
                            ${formatarData(
                                devolucao.dataDevolucao
                            )}
                        </td>

                        <td>
                            ${formatarData(
                                devolucao.dataDevolucao
                            )}
                        </td>

                        <td>

                            <span class="badge bg-success">
                                Devolvido
                            </span>

                        </td>

                    </tr>

                `;

            });


            atualizarIndicadores(devolucoes);

        }


        // ATUALIZAR INDICADORES

        function atualizarIndicadores(
            devolucoes
        ) {

            // TOTAL

            document.getElementById(
                "totalDevolucoes"
            ).innerText =
                devolucoes.length;


            // DATA DE HOJE

            const hoje =
                new Date()
                    .toISOString()
                    .split("T")[0];


            const hojeTotal =
                devolucoes.filter(function(
                    devolucao
                ) {

                    /*
                     * Atualmente o sistema registra
                     * a devolução usando a data prevista.
                     */

                    return (
                        devolucao.dataDevolucao ===
                        hoje
                    );

                }).length;


            document.getElementById(
                "devolucoesHoje"
            ).innerText =
                hojeTotal;


            // LIVROS DEVOLVIDOS

            document.getElementById(
                "livrosDevolvidos"
            ).innerText =
                devolucoes.length;

        }


        // FORMATAR DATA

        function formatarData(data) {

            if (!data) {

                return "-";

            }


            const partes =
                data.split("-");


            if (partes.length !== 3) {

                return data;

            }


            return (
                partes[2] +
                "/" +
                partes[1] +
                "/" +
                partes[0]
            );

        }


        // VOLTAR

        function voltar() {

            window.location.href =
                "dashboard.html";

        }


        // SAIR

        function sair() {

            window.location.href =
                "index.html";

        }


        // CARREGAR

        listarDevolucoes();

    </script>

</body>

</html>
